name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: API (pytest, ruff, mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # In parallel (pytest-xdist), as the local gates run (scripts/record_history.py): the same
      # tests and coverage. Measured on the 4-vCPU runner it gains little (7 min 25 s against
      # 7 min 42 s serial, PR #257) where it halves a 4-CPU container's run; the job is the
      # critical path of CI.
      - run: uv run pytest -n auto --cov --cov-report=term
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  web:
    name: Web (svelte-check, lint, vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test

  # docs/workflow.md §5, item 5: every PR adds its line to docs/history.md, naming the PR or its
  # branch, in the PR itself. Pull requests only; a few seconds.
  history:
    name: History line
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: docs/history.md gains a line naming this PR or its branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          added=$(git diff "origin/${BASE_REF}...HEAD" -- docs/history.md | grep '^+[^+]' || true)
          # The number whole (#25 is not #257); the branch in backticks, as history.md writes it.
          if grep -qE "#${PR_NUMBER}([^0-9]|$)" <<<"$added" \
            || grep -qF "\`${HEAD_REF}\`" <<<"$added"; then
            echo "docs/history.md names #${PR_NUMBER} or \`${HEAD_REF}\`."
          else
            echo "::error file=docs/history.md::Add this PR's line to docs/history.md, naming #${PR_NUMBER} or the branch \`${HEAD_REF}\` (docs/workflow.md §5, item 5)."
            exit 1
          fi

  # docs/workflow.md §4.2: whether the change needs the end-to-end suite. It is skipped only when
  # every changed file is one no browser test or build reads (they read apps/ alone): docs/,
  # CLAUDE.md, README.md, .claude/, the PR template and deploy-api.yml; anything new under .github/
  # (a local action this file could use) runs it. A push to main runs it always, so
  # every head of main, and so every commit the deploy may take (D25), has a full run. On any
  # error this job fails, and e2e-result with it: it fails closed.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.paths.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ]; then
            echo "A push to main: every job runs."
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pull request's merge commit, or a branch's head, against where it left main: main
          # whatever the PR's base, so a stacked PR retargeted to main (an `edited` event, which
          # starts no run) was already judged by everything it brings to main.
          fork=$(git merge-base origin/main HEAD)
          # --no-renames: a file moved out of apps/ is listed under its old path too.
          changed=$(git diff --name-only --no-renames "$fork" HEAD)
          printf 'Changed since %s:\n%s\n' "${fork:0:7}" "$changed"
          skip='^(docs/|\.claude/|CLAUDE\.md$|README\.md$|\.github/pull_request_template\.md$'
          skip+='|\.github/workflows/deploy-api\.yml$)'
          needs=$(grep -vE "$skip" <<<"$changed" || true)
          if [ -n "$needs" ]; then
            printf 'The end-to-end suite runs for:\n%s\n' "$needs"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file a browser test reads changed: the end-to-end suite is skipped."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    name: End-to-end (Playwright, ${{ matrix.project }}, ${{ matrix.shard }}/6)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    # Pinned: ubuntu-latest is moving to Ubuntu 26.04, where Playwright 1.56.1 has no
    # Chromium to install. Back to ubuntu-latest with a Playwright that supports 26.04.
    runs-on: ubuntu-24.04
    # Each Playwright project in six shards, parallel jobs, each with its own API and app:
    # within one job the suite runs in one worker (the API solves one request per client at a
    # time, playwright.config.ts), so one job per project took 21-33 min, CI's critical path
    # (docs/workflow.md §4.2). Every test still runs, in exactly one shard. Playwright splits by
    # test count, not time, and the heavy tests come last: three shards took 2.4-3.5, 6.7-9.3
    # and 15.1-17.0 min (run on f1929c1), so six.
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: apps/api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Generated API types are up to date
        if: matrix.project == 'desktop' && matrix.shard == 1
        run: pnpm gen:types && git diff --exit-code -- src/lib/api
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e --project=${{ matrix.project }} --shard=${{ matrix.shard }}/6
        working-directory: apps/web
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: apps/web/test-results
          retention-days: 7

  # One result for the suite, under the name it had before the projects were split: green when
  # every shard is, or when the changes job decided the suite was not needed and it was skipped.
  e2e-result:
    name: End-to-end (Playwright, desktop + mobile)
    if: always()
    needs: [changes, e2e]
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.e2e }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [ "$CHANGES" = success ] && [ "$NEEDED" = false ] && [ "$E2E" = skipped ]; then
            echo "No file a browser test reads changed (docs/workflow.md §4.2): skipped."
            exit 0
          fi
          echo "changes: $CHANGES, needed: $NEEDED, e2e: $E2E"
          test "$CHANGES" = success && test "$E2E" = success
