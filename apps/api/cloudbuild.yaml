# Cloud Build: the API image, recording the commit it is built from (TSD §11.2). The build
# fetches that commit from GitHub, so the image is exactly the public source it links, with no
# local or unpushed changes. gcloud reads --config from the local machine, not from the GitHub
# source, so this file is fetched at the same commit (no checkout needed, e.g. in Cloud Shell):
#
#   SHA=$(git ls-remote https://github.com/ccirone2/opensolve-pipe refs/heads/main | cut -f1)
#   curl -fsSL "https://raw.githubusercontent.com/ccirone2/opensolve-pipe/$SHA/apps/api/cloudbuild.yaml" \
#     -o /tmp/cloudbuild.yaml
#   gcloud builds submit https://github.com/ccirone2/opensolve-pipe --git-source-revision="$SHA" \
#     --git-source-dir=apps/api --config=/tmp/cloudbuild.yaml \
#     --substitutions="_IMAGE=$IMAGE,_SOURCE_COMMIT=$SHA"
#
# Neither substitution has a default: Cloud Build refuses a build that leaves one out (unless
# ALLOW_LOOSE is set, which triggers set), and the step refuses a commit that is not a full
# 40-character hash, such as an empty or short one. The server reports the commit at
# /api/v1/about and redirects /source to it (AGPL-3.0 §13; src/opensolve_pipe/source.py).
steps:
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        [[ "${_SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$$ ]] || { echo "_SOURCE_COMMIT must be a full 40-character commit hash" >&2; exit 1; }
        docker build --build-arg "SOURCE_COMMIT=${_SOURCE_COMMIT}" -t "${_IMAGE}" .
images: ["${_IMAGE}"]
