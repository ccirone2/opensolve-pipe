[project]
name = "opensolve-pipe"
version = "0.1.0"
description = "OpenSolve Pipe API: steady-state hydraulic analysis of pressurized pipe networks"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "coolprop==8.0.0",
    "fastapi>=0.156.4",
    "fluids==1.3.1",
    "numpy>=2.5.4",
    "pydantic>=2.11",
    "scipy>=1.18.1",
    "uvicorn>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4", "PT", "NPY"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fluids.*", "CoolProp.*", "wntr.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Starlette recommends httpx2 for its TestClient; httpx still works and is what we pin.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["opensolve_pipe"]
branch = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "scipy-stubs>=1.18.1.1",
    "wntr>=1.5.0",
]
